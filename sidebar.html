<style>
  /* Estilos específicos para mejorar la jerarquía de los menús y submenús */
  .menu-group {
    margin-bottom: 0.5rem;
  }

  .menu-group__title {
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #FFFFFF;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .menu-group__title:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
  }

  /* Estilo y animación de la flecha */
  .menu-arrow {
    font-size: 0.7rem;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .menu-group.is-open .menu-arrow {
    transform: rotate(180deg);
  }

  /* Animación de desplazamiento suave para los submenús */
  .menu-list {
    list-style: none;
    padding: 0;
    margin: 0.35rem 0 0 0;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
  }

  .menu-group.is-open .menu-list {
    max-height: 200px; /* Altura suficiente para contener los submenús */
    opacity: 1;
  }

  .menu-link {
    display: flex;
    align-items: center;
    padding: 0.6rem 0.75rem 0.6rem 1.75rem; /* Mayor sangría a la izquierda */
    color: #C5C8CE;
    text-decoration: none;
    font-size: 0.85rem; /* Letra ligeramente más pequeña que el menú principal */
    font-weight: 400;
    border-radius: 6px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .menu-link:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #FFFFFF;
  }
</style>

<script>
  // Actualización de la lógica para manejar las clases de apertura y cierre con la animación
  document.addEventListener('DOMContentLoaded', () => {
    const sidebarElement = document.getElementById('sidebar') || document;
    
    // Auto-abrir el grupo si contiene la página activa
    const currentPath = window.location.pathname.split('/').pop();
    const menuLinks = sidebarElement.querySelectorAll('.menu-link');

    menuLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath) {
        link.style.background = 'rgba(255, 255, 255, 0.12)';
        link.style.color = '#FFFFFF';
        
        const parentGroup = link.closest('.menu-group');
        if (parentGroup) {
          parentGroup.classList.add('is-open');
        }
      }
    });

    // Control de acordeón con animación
    const menuTitles = sidebarElement.querySelectorAll('.menu-group__title');
    menuTitles.forEach(title => {
      // Evitar duplicar eventos si se recarga dinámicamente
      title.onclick = () => {
        const parentGroup = title.closest('.menu-group');
        if (!parentGroup) return;

        const isOpen = parentGroup.classList.contains('is-open');
        
        // Opcional: cerrar los demás grupos para un comportamiento de acordeón estricto
        document.querySelectorAll('.menu-group').forEach(group => {
          group.classList.remove('is-open');
        });

        if (!isOpen) {
          parentGroup.classList.add('is-open');
        }
      };
    });
  });
</script>
