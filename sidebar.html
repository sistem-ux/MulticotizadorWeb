<script>
  if (typeof toggleMenu !== 'function') {
    function toggleMenu(groupId) {
      const group = document.getElementById(groupId);
      if (!group) return;
      
      const isOpen = group.classList.contains('is-open');
      
      // Cierra todos los grupos (efecto acordeón)
      document.querySelectorAll('.menu-group').forEach(el => {
        el.classList.remove('is-open');
      });

      if (!isOpen) {
        group.classList.add('is-open');
      }
    }
  }

  // Ejecución inmediata para asegurar que detecte la página activa al cargar el componente
  (function initSidebarActiveState() {
    const currentPath = window.location.pathname.split('/').pop();
    const menuLinks = document.querySelectorAll('.menu-link');

    menuLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath) {
        link.style.background = 'rgba(255, 255, 255, 0.12)';
        link.style.color = '#FFFFFF';
        
        const parentGroup = link.closest('.menu-group');
        if (parentGroup) {
          parentGroup.classList.add('is-open');
        }
      }
    });
  })();
</script>
