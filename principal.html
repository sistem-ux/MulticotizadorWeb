<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | MulticotizadorWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">
    <div class="card" style="max-width: 450px; text-align: center;">

      <!-- Espacio para el logo en la parte superior y centrado -->
      <header class="page-header" style="margin-bottom: 24px;">
        <div class="logo-container">
          <!-- Reemplaza el archivo 'assets/logo.png' con tu logo. -->
          <!-- Coloca la imagen en: c:/Desarrollos/MulticotizadorWeb/MulticotizadorWeb/assets/logo.png -->
          <img src="assets/logo.png" alt="MulticotizadorWeb" class="brand-logo" />
        </div>
        <h1 class="page-header__title" style="font-size: 26px;">MulticotizadorWeb</h1>
        <p class="page-header__subtitle">Selecciona tu perfil para continuar</p>
      </header>

      <form id="loginForm" novalidate>

        <!-- Selector de tipo de usuario -->
        <section class="form-section" style="text-align: left;">
          <label for="userRole" class="form-label">Iniciar sesión como</label>
          <select id="userRole" class="text-input" style="cursor: pointer;">
            <option value="">Selecciona un perfil...</option>
            <option value="Visitante">Visitante</option>
            <option value="Usuario">Usuario registrado</option>
          </select>
        </section>

        <!-- Campos condicionales para roles con credenciales -->
        <div id="credentialsFields" style="display: none; text-align: left;">
          <section class="form-section">
            <label for="userEmail" class="form-label">Correo electrónico</label>
            <input 
              type="email" 
              id="userEmail" 
              class="text-input" 
              placeholder="correo@ejemplo.com"
              autocomplete="off"
            >
          </section>

          <section class="form-section">
            <label for="userPassword" class="form-label">Contraseña</label>
            <input 
              type="password" 
              id="userPassword" 
              class="text-input" 
              placeholder="Ingresa tu contraseña"
              autocomplete="off"
            >
          </section>
        </div>

        <!-- Botón de acción -->
        <section class="form-section form-section--actions" style="margin-top: 24px;">
          <button type="submit" id="accessBtn" class="btn btn--primary" style="width: 100%;">
            Ingresar al Sistema
          </button>
        </section>

      </form>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // CONFIG: Si prefieres mantener las claves fuera del HTML, crea un archivo
    // `supabase-config.js` en este mismo directorio (está en .gitignore) que exporte:
    // export const SUPABASE_URL = 'https://...';
    // export const SUPABASE_ANON_KEY = 'public-anon-key';
    // Hay un ejemplo en `supabase-config.example.js`.
    //
    // Si ese archivo no existe, se usa como respaldo la misma configuración
    // que ya está en usuarios.js, para que el login funcione igual "out of the box".
    let SUPABASE_URL = 'https://cibtpkpxdrykozujaqba.supabase.co';
    let SUPABASE_ANON_KEY = 'sb_publishable_zlp4_HGpTeAQKW55c_pZQA_2HEXRpaC';
    const TABLE_NAME = 'usuarios';

    /*
      NOTA DE SEGURIDAD:
      Esta pantalla consulta la tabla `usuarios` con la clave anónima (anon key)
      y compara la contraseña en el propio navegador. Esto solo es aceptable en un
      entorno de práctica/demo. Para producción se recomienda:
        1) Activar Row Level Security (RLS) en la tabla `usuarios`.
        2) Mover la validación a una función RPC de Postgres (o Edge Function) que
           reciba email/password y devuelva únicamente el perfil, sin exponer la
           columna password al cliente.
        3) Migrar la autenticación a Supabase Auth (supabase.auth.signInWithPassword)
           y guardar el perfil en una tabla `profiles` enlazada por auth.uid().
    */

    async function initLogin() {
      const userRoleSelect = document.getElementById('userRole');
      const credentialsFields = document.getElementById('credentialsFields');
      const loginForm = document.getElementById('loginForm');
      const accessBtn = document.getElementById('accessBtn');

      // Intentamos cargar la configuración local opcional `supabase-config.js`
      try {
        const cfg = await import('./supabase-config.js');
        if (cfg?.SUPABASE_URL) SUPABASE_URL = cfg.SUPABASE_URL;
        if (cfg?.SUPABASE_ANON_KEY) SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
      } catch (err) {
        // No hay archivo de configuración local; se usa el respaldo definido arriba.
      }

      let supabase = null;
      try {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.error('Error al inicializar Supabase:', err);
      }

      // Mostrar/ocultar correo y contraseña según el perfil elegido
      userRoleSelect.addEventListener('change', (e) => {
        const selectedRole = e.target.value;
        credentialsFields.style.display = selectedRole === 'Usuario' ? 'block' : 'none';
      });

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const selectedRole = userRoleSelect.value;

        if (!selectedRole) {
          alert('Por favor selecciona un tipo de usuario.');
          return;
        }

        // Visitante: acceso directo al cotizador, sin credenciales
        if (selectedRole === 'Visitante') {
          localStorage.removeItem('userId');
          localStorage.removeItem('userFullName');
          localStorage.setItem('userRole', 'Visitante');
          localStorage.setItem('userEmail', '');
          window.location.href = 'cotizador.html';
          return;
        }

        const userEmail = document.getElementById('userEmail').value.trim().toLowerCase();
        const userPassword = document.getElementById('userPassword').value;

        if (!userEmail || !userPassword) {
          alert('Por favor completa el correo electrónico y la contraseña.');
          return;
        }

        if (!supabase) {
          alert('No se pudo conectar con Supabase. Revisa la configuración.');
          return;
        }

        accessBtn.disabled = true;
        accessBtn.textContent = 'Verificando...';

        try {
          // Buscamos al usuario por correo en la tabla `usuarios`
          const { data, error } = await supabase
            .from(TABLE_NAME)
            .select('id, full_name, email, perfil, password')
            .eq('email', userEmail)
            .maybeSingle();

          if (error) {
            console.error('Error consultando usuarios:', error);
            alert('No se pudo validar tus credenciales. Intenta de nuevo.');
            return;
          }

          // Validamos que exista y que la contraseña coincida
          if (!data || data.password !== userPassword) {
            alert('Correo o contraseña incorrectos, o el usuario no está registrado.');
            return;
          }

          // Identificamos el perfil real del usuario (Asesor / Colaborador / Administrador)
          localStorage.setItem('userId', data.id);
          localStorage.setItem('userFullName', data.full_name);
          localStorage.setItem('userEmail', data.email);
          localStorage.setItem('userRole', data.perfil);

          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error('Excepción validando usuario:', err);
          alert('No se pudo conectar con Supabase. Intenta de nuevo.');
        } finally {
          accessBtn.disabled = false;
          accessBtn.textContent = 'Ingresar al Sistema';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initLogin);
  </script>
</body>
</html>
