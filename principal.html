<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | MulticotizadorWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">
    <div class="card" style="max-width: 450px; text-align: center;">

      <!-- Espacio para el logo en la parte superior y centrado -->
      <header class="page-header" style="margin-bottom: 24px;">
        <div class="logo-container">
          <!-- Reemplaza el archivo 'assets/logo.png' con tu logo. -->
          <!-- Coloca la imagen en: c:/Desarrollos/MulticotizadorWeb/MulticotizadorWeb/assets/logo.png -->
          <img src="assets/logo.svg" alt="MulticotizadorWeb" class="brand-logo" />
        </div>
        <h1 class="page-header__title" style="font-size: 26px;">MulticotizadorWeb</h1>
        <p class="page-header__subtitle">Selecciona tu perfil para continuar</p>
      </header>

      <form id="loginForm" novalidate>

        <!-- Selector de tipo de usuario -->
        <section class="form-section" style="text-align: left;">
          <label for="userRole" class="form-label">Iniciar sesión como</label>
          <select id="userRole" class="text-input" style="cursor: pointer;">
            <option value="">Selecciona un perfil...</option>
            <option value="Visitante">Visitante</option>
            <option value="Asesor">Asesor</option>
            <option value="Colaborador">Colaborador</option>
            <option value="Administrador">Administrador</option>
          </select>
        </section>

        <!-- Campos condicionales para roles con credenciales -->
        <div id="credentialsFields" style="display: none; text-align: left;">
          <section class="form-section">
            <label for="userEmail" class="form-label">Correo electrónico</label>
            <input 
              type="email" 
              id="userEmail" 
              class="text-input" 
              placeholder="correo@ejemplo.com"
              autocomplete="off"
            >
          </section>

          <section class="form-section">
            <label for="userPassword" class="form-label">Contraseña</label>
            <input 
              type="password" 
              id="userPassword" 
              class="text-input" 
              placeholder="Ingresa tu contraseña"
              autocomplete="off"
            >
          </section>
        </div>

        <!-- Botón de acción -->
        <section class="form-section form-section--actions" style="margin-top: 24px;">
          <button type="submit" id="accessBtn" class="btn btn--primary" style="width: 100%;">
            Ingresar al Sistema
          </button>
        </section>

      </form>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // CONFIG: Si prefieres mantener las claves fuera del HTML, crea un archivo
    // `supabase-config.js` en este mismo directorio que exporte dos constantes:
    // export const SUPABASE_URL = 'https://...';
    // export const SUPABASE_ANON_KEY = 'public-anon-key';
    // Hay un ejemplo en `supabase-config.example.js`.

    let SUPABASE_URL = '';
    let SUPABASE_ANON_KEY = '';

    async function initLogin() {
      const userRoleSelect = document.getElementById('userRole');
      const credentialsFields = document.getElementById('credentialsFields');
      const loginForm = document.getElementById('loginForm');

      // Intentamos cargar un archivo local opcional `supabase-config.js`
      try {
        const cfg = await import('./supabase-config.js');
        if (cfg?.SUPABASE_URL) SUPABASE_URL = cfg.SUPABASE_URL;
        if (cfg?.SUPABASE_ANON_KEY) SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
      } catch (err) {
        // No hay archivo de configuración, continuamos con fallback
      }

      let supabase = null;
      if (SUPABASE_URL && SUPABASE_ANON_KEY) {
        try {
          supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
          console.error('Error initializing Supabase client', err);
        }
      }

      // Controlar la visualización de correo y contraseña según el rol
      userRoleSelect.addEventListener('change', (e) => {
        const selectedRole = e.target.value;
        if (selectedRole === 'Visitante') {
          credentialsFields.style.display = 'none';
        } else if (selectedRole) {
          credentialsFields.style.display = 'block';
        } else {
          credentialsFields.style.display = 'none';
        }
      });

      // Manejar la acción del botón de ingreso
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const selectedRole = userRoleSelect.value;

        if (!selectedRole) {
          alert('Por favor selecciona un tipo de usuario.');
          return;
        }

        if (selectedRole === 'Visitante') {
          window.location.href = 'cotizador.html';
          return;
        }

        const userEmail = document.getElementById('userEmail').value.trim();
        const userPassword = document.getElementById('userPassword').value.trim();

        if (!userEmail || !userPassword) {
          alert('Por favor completa el correo electrónico y la contraseña.');
          return;
        }

        // Si hay configuración de Supabase, intentamos autenticar contra Supabase
        if (supabase) {
          try {
            const result = await supabase.auth.signInWithPassword({ email: userEmail, password: userPassword });
            if (result.error || !result.data || !result.data.user) {
              alert('Credenciales inválidas o usuario no encontrado en Supabase.');
              return;
            }

            // Autenticación exitosa
            localStorage.setItem('userRole', selectedRole);
            localStorage.setItem('userEmail', userEmail);
            alert(`Bienvenido (${selectedRole}). Accediendo al cotizador...`);
            window.location.href = 'cotizador.html';
            return;
          } catch (err) {
            console.error('Supabase error', err);
            alert('Error al comunicarse con Supabase. Revisa la configuración.');
            return;
          }
        }

        // Fallback: si no se configuró Supabase, mantenemos el comportamiento previo
        localStorage.setItem('userRole', selectedRole);
        localStorage.setItem('userEmail', userEmail);
        alert(`Bienvenido (${selectedRole}). Accediendo al cotizador...`);
        window.location.href = 'cotizador.html';
      });
    }

    document.addEventListener('DOMContentLoaded', initLogin);
  </script>
</body>
</html>
