<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | MulticotizadorWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       TOKENS (Basado en el estilo proporcionado)
       ========================================================= */
    :root {
      --color-navy: #001F5B;
      --color-navy-soft: #0A2E70;
      --color-green: #2C7D3C;
      --color-green-dark: #235F2F;
      --color-gray: #A6A9B0;
      --color-gray-light: #F2F3F5;
      --color-gray-border: #D8DAE0;
      --color-white: #FFFFFF;
      --color-danger: #C0392B;

      --font-display: 'Poppins', 'Inter', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --shadow-card: 0 10px 30px rgba(0, 31, 91, 0.10);
      --shadow-soft: 0 2px 8px rgba(0, 31, 91, 0.06);

      --transition: 0.25s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-navy);
      background: linear-gradient(180deg, #EEF1F6 0%, #E4E8F0 100%);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: var(--font-display);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================================================
       SIDEBAR LAYOUT
       ========================================================= */
    .sidebar {
      width: 260px;
      background: var(--color-navy);
      color: var(--color-white);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), width var(--transition);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
    }

    .sidebar.is-hidden {
      transform: translateX(-100%);
    }

    .sidebar__header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar__logo {
      width: 40px;
      height: 40px;
      background-color: var(--color-white);
      color: var(--color-navy);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .sidebar__title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .sidebar__nav {
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    .menu-group__title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: none;
      color: var(--color-gray);
      margin-bottom: 0.5rem;
      padding-left: 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: color var(--transition);
    }

    .menu-group__title:hover {
      color: var(--color-white);
    }

    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .menu-list.is-hidden {
      display: none;
    }

    .menu-link {
      display: flex;
      align-items: center;
      padding: 0.75rem 0.85rem;
      color: #D8DAE0;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition);
    }

    .menu-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-white);
    }

    /* =========================================================
       MAIN CONTENT AREA
       ========================================================= */
    .main-content {
      flex: 1;
      margin-left: 260px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left var(--transition);
    }

    .main-content.is-expanded {
      margin-left: 0;
    }

    /* Top navbar with toggle buttons */
    .topbar {
      height: 70px;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-gray-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .topbar__actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-toggle {
      background: var(--color-gray-light);
      border: 1px solid var(--color-gray-border);
      color: var(--color-navy);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1.1rem;
      transition: background var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-toggle:hover {
      background: var(--color-gray-border);
    }

    /* Page Body / Cards wrapper */
    .page {
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      flex: 1;
    }

    .card {
      width: 100%;
      max-width: 900px;
      background: var(--color-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 2rem;
      align-self: flex-start;
    }

    .page-header {
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--color-gray-border);
    }

    .page-header__eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-green);
      background: rgba(44, 125, 60, 0.10);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .page-header__title {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--color-navy);
      line-height: 1.25;
    }

    .page-header__subtitle {
      margin: 0.6rem 0 0;
      color: #5B6472;
      font-size: 0.95rem;
    }

    /* Dashboard Grid stats */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .stat-card {
      background: var(--color-gray-light);
      border: 1px solid var(--color-gray-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
    }

    .stat-card__title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #5B6472;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-card__value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-navy);
      margin-top: 0.5rem;
      font-family: var(--font-display);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.is-mobile-visible {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Verificación temprana de sesión y perfil: si el usuario no tiene permiso
       para esta página, se redirige antes de que se cargue cualquier dato. -->
  <script src="auth-guard.js"></script>
  <script>requireAccess('dashboard.html');</script>

  <!-- BARRA LATERAL DINÁMICA (Se carga automáticamente desde sidebar.html) -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div id="mainContent" class="main-content">
    
    <!-- BARRA SUPERIOR CON BOTONES PARA MOSTRAR/OCULTAR Y USUARIO -->
    <header class="topbar">
      <div class="topbar__actions">
        <button id="sidebarToggle" class="btn-toggle" title="Ocultar / Mostrar Menú">☰</button>
      </div>
      
      <!-- Contenedor dinámico del nombre/correo del usuario -->
      <div id="loggedUserDisplay" style="font-weight: 600; font-size: 0.9rem; color: var(--color-navy);">
        Cargando...
      </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE LA PÁGINA -->
    <main class="page">
      <div class="card">
        
        <header class="page-header">
          <span class="page-header__eyebrow">Bienvenido al sistema</span>
          <h1 class="page-header__title">Dashboard Principal</h1>
          <p class="page-header__subtitle">Selecciona una opción en el menú lateral o utiliza los accesos directos para comenzar.</p>
        </header>

        <section class="form-section">
          <h3 class="section-title">Resumen General</h3>
          <div class="dashboard-grid">
            <div class="stat-card">
              <div class="stat-card__title">Módulo Activo</div>
              <div class="stat-card__value">Inicio</div>
            </div>
            <div class="stat-card__title" style="background: var(--color-gray-light); border: 1px solid var(--color-gray-border); border-radius: var(--radius-md); padding: 1.25rem;">
              <span class="stat-card__title" style="display:block;">Acceso Directo</span>
              <a href="cotizador.html" style="display: inline-block; margin-top: 0.75rem; color: var(--color-green); font-weight: 600; text-decoration: none;">Ir al Cotizador →</a>
            </div>
            <div class="stat-card" style="background: var(--color-gray-light); border: 1px solid var(--color-gray-border); border-radius: var(--radius-md); padding: 1.25rem;">
              <span class="stat-card__title" style="display:block;">Gestión</span>
              <a href="usuarios.html" style="display: inline-block; margin-top: 0.75rem; color: var(--color-navy); font-weight: 600; text-decoration: none;">Ver Usuarios →</a>
            </div>
          </div>
        </section>

      </div>
    </main>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 'dashboard.html' debe coincidir con la clave en PAGE_PERMISSIONS
      // (auth-guard.js, ya cargado al inicio del body).
      initAppShell({ pageName: 'dashboard.html' });
    });
  </script>
</body>
</html>
